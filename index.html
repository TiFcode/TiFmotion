<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>TiFmotion ⬜</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: linear-gradient(180deg, #eef7ff 0%, #dff2ff 45%, #f9fbff 100%);
      color: #13304b;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-user-select: none;
    }

    .topbar {
      padding: 12px 14px 8px;
      text-align: center;
      flex-shrink: 0;
    }
    h1 { font-size: clamp(1.45rem, 4.8vw, 2.3rem); }
    .subtitle {
      margin-top: 4px;
      color: #4c7091;
      font-size: clamp(.88rem, 2.8vw, 1rem);
      line-height: 1.35;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      padding: 0 10px 10px;
      flex-shrink: 0;
    }
    .pill, .button, .slider-card {
      background: rgba(255,255,255,.95);
      border: 2px solid #d6ebff;
      border-radius: 999px;
      box-shadow: 0 8px 22px rgba(58, 108, 160, .12);
    }
    .pill {
      padding: 8px 14px;
      font-weight: 700;
      color: #33597c;
      font-size: .95rem;
    }
    .pill strong { color: #ff8f45; }
    .button {
      border: 0;
      padding: 10px 16px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      color: white;
      transition: transform .15s ease, filter .15s ease;
    }
    .button:hover { filter: brightness(1.04); }
    .button:active { transform: scale(.97); }
    .button.primary { background: linear-gradient(135deg, #6eb8ff, #4f86f7); }
    .button.success { background: linear-gradient(135deg, #47d99c, #15b86f); }
    .button.warm { background: linear-gradient(135deg, #ffb24d, #ff8a3d); }
    .button.soft { background: linear-gradient(135deg, #b09dff, #8f79ff); }
    .button.ghost {
      background: white;
      color: #33597c;
      border: 2px solid #d6ebff;
      box-shadow: 0 8px 22px rgba(58, 108, 160, .12);
    }

    .slider-card {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      color: #33597c;
      font-weight: 700;
      min-width: 220px;
    }
    .slider-card input { width: 120px; accent-color: #4f86f7; }

    .board-wrap {
      flex: 1;
      min-height: 0;
      padding: 0 12px 12px;
      display: flex;
    }

    .stage-card {
      position: relative;
      flex: 1;
      overflow: hidden;
      min-height: 320px;
      background: rgba(255,255,255,.92);
      border: 3px solid #dff0ff;
      border-radius: 26px;
      box-shadow: 0 18px 44px rgba(79, 134, 247, .14);
    }
    .stage {
      position: absolute;
      inset: 0;
      overflow: hidden;
      touch-action: none;
      background:
        linear-gradient(90deg, rgba(130, 182, 255, .09) 1px, transparent 1px),
        linear-gradient(rgba(130, 182, 255, .09) 1px, transparent 1px),
        linear-gradient(180deg, #ffffff 0%, #f7fbff 100%);
      background-size: 44px 44px, 44px 44px, auto;
    }
    .stage.playing { cursor: default; }
    .stage.editing { cursor: crosshair; }

    .path-layer, .marker-layer, .square-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .marker {
      position: absolute;
      width: 34px;
      height: 34px;
      margin-left: -17px;
      margin-top: -17px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffcf7d, #ff8a3d);
      box-shadow: 0 10px 20px rgba(255, 138, 61, .35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .9rem;
      font-weight: 900;
      color: white;
      pointer-events: auto;
      touch-action: none;
      cursor: grab;
      border: 3px solid rgba(255,255,255,.95);
      transition: transform .12s ease;
      transform-origin: center;
    }
    .marker.active { transform: scale(1.12); }
    .marker.dragging { cursor: grabbing; transform: scale(1.16); }

    .square {
      position: absolute;
      width: 46px;
      height: 46px;
      margin-left: -23px;
      margin-top: -23px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(110, 184, 255, .7), rgba(79, 134, 247, .7) 55%, rgba(118, 87, 255, .7));
      box-shadow: 0 14px 24px rgba(79, 134, 247, .32);
      border: 4px solid rgba(255,255,255,.7);
      transition: opacity .2s ease;
      pointer-events: none;
      opacity: .7;
    }

    .tip {
      position: absolute;
      left: 14px;
      top: 14px;
      background: rgba(255,255,255,.92);
      color: #4b6b89;
      border-radius: 18px;
      padding: 10px 12px;
      font-size: .86rem;
      line-height: 1.35;
      box-shadow: 0 8px 22px rgba(0,0,0,.08);
      max-width: min(310px, 64vw);
    }

    @media (max-width: 560px) {
      .toolbar { gap: 6px; }
      .pill { font-size: .86rem; padding: 7px 12px; }
      .button { padding: 9px 14px; }
      .slider-card { min-width: 0; width: 100%; justify-content: center; }
      .slider-card input { width: 100px; }
      .side-card { max-height: 48vh; }
      .marker { width: 30px; height: 30px; margin-left: -15px; margin-top: -15px; }
      .square { width: 40px; height: 40px; margin-left: -20px; margin-top: -20px; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>⬜ TiFmotion</h1>
    <div class="subtitle">Tap to place square stops, drag them around, then press play and watch the square glide through them forever.</div>
  </div>

  <div class="toolbar">
    <div class="pill">Stops <strong id="stopCount">0</strong></div>
    <div class="pill">Mode <strong id="modeLabel">Editing</strong></div>
    <button class="button success" id="playBtn">▶️ Play</button>
    <button class="button warm" id="pauseBtn">⏸️ Pause</button>
    <button class="button soft" id="previewBtn">👀 Jump to first stop</button>
    <button class="button ghost" id="undoBtn">↩️ Undo</button>
    <button class="button ghost" id="clearBtn">🗑️ Clear all</button>
    <button class="button primary" id="shuffleBtn">🎲 Make a path</button>
    <button class="button ghost" id="lineBtn">📏 Straight line</button>
    <div class="slider-card">
      <span>Speed</span>
      <input id="speedSlider" type="range" min="1" max="9" step="1" value="6">
      <strong id="speedValue">2.0s</strong>
    </div>
  </div>

  <div class="board-wrap">
    <div class="stage-card">
      <div class="stage editing" id="stage">
        <svg class="path-layer" id="pathLayer" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
        <div class="marker-layer" id="markerLayer"></div>
        <div class="square-layer">
          <div class="square" id="square"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const stage = document.getElementById('stage');
    const markerLayer = document.getElementById('markerLayer');
    const pathLayer = document.getElementById('pathLayer');
    const square = document.getElementById('square');
    const stopCountEl = document.getElementById('stopCount');
    const modeLabel = document.getElementById('modeLabel');
    const speedSlider = document.getElementById('speedSlider');
    const speedValue = document.getElementById('speedValue');

    const state = {
      stops: [],
      isPlaying: false,
      segmentDuration: 5 - (Number(speedSlider.value) - 1) * 0.4875,
      dragId: null,
      dragOffset: { x: 0, y: 0 },
      animationStart: 0,
      rafId: null,
      currentSegment: 0,
      history: [],
      pointerMoved: false
    };

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function makeId() {
      if (globalThis.crypto?.randomUUID) return globalThis.crypto.randomUUID();
      return 'stop-' + Date.now() + '-' + Math.random().toString(16).slice(2);
    }

    function snapshotHistory() {
      state.history.push(JSON.stringify(state.stops));
      if (state.history.length > 40) state.history.shift();
    }

    function restoreHistory() {
      if (!state.history.length) return;
      state.stops = JSON.parse(state.history.pop());
      if (state.stops.length < 2) stopAnimation();
      render();
    }

    function randomColor(index) {
      const colors = ['#ff8a3d', '#ffb74d', '#7ed6ff', '#7fdcaa', '#c29dff'];
      return colors[index % colors.length];
    }

    function getStagePoint(clientX, clientY) {
      const rect = stage.getBoundingClientRect();
      return {
        x: clamp(clientX - rect.left, 0, rect.width),
        y: clamp(clientY - rect.top, 0, rect.height),
        width: rect.width,
        height: rect.height
      };
    }

    function placeSquare(point) {
      square.style.left = point.x + 'px';
      square.style.top = point.y + 'px';
      square.style.opacity = state.stops.length ? '1' : '.35';
    }

    function buildPath() {
      if (state.stops.length === 0) {
        pathLayer.innerHTML = '';
        pathLayer.setAttribute('viewBox', '0 0 1 1');
        return;
      }

      const width = stage.clientWidth || 1;
      const height = stage.clientHeight || 1;
      pathLayer.setAttribute('viewBox', `0 0 ${width} ${height}`);

      const centerPoints = state.stops
        .map(stop => `${stop.x},${stop.y}`)
        .join(' ');

      let svg = '';
      if (state.stops.length > 1) {
        svg += `<polyline points="${centerPoints}" fill="none" stroke="#9ad2ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 10" />`;
        const loopPoints = centerPoints + ' ' + `${state.stops[0].x},${state.stops[0].y}`;
        svg += `<polyline points="${loopPoints}" fill="none" stroke="rgba(154,210,255,.45)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />`;
      }
      state.stops.forEach((stop, index) => {
        svg += `<circle cx="${stop.x}" cy="${stop.y}" r="3" fill="${randomColor(index)}" opacity=".5" />`;
      });
      pathLayer.innerHTML = svg;
    }

    function renderMarkers() {
      markerLayer.innerHTML = '';
      state.stops.forEach((stop, index) => {
        const marker = document.createElement('button');
        marker.className = 'marker' + (index === state.currentSegment && state.isPlaying ? ' active' : '');
        marker.textContent = index + 1;
        marker.style.left = stop.x + 'px';
        marker.style.top = stop.y + 'px';
        marker.style.background = `linear-gradient(135deg, ${randomColor(index)}, #ff8a3d)`;
        marker.dataset.id = stop.id;
        marker.addEventListener('pointerdown', event => beginDrag(event, stop.id));
        marker.addEventListener('dblclick', event => {
          event.stopPropagation();
          removeStop(stop.id);
        });
        markerLayer.appendChild(marker);
      });
    }

    function renderMeta() {
      stopCountEl.textContent = state.stops.length;
      modeLabel.textContent = state.isPlaying ? 'Playing' : 'Editing';
      stage.classList.toggle('playing', state.isPlaying);
      stage.classList.toggle('editing', !state.isPlaying);
      speedValue.textContent = `${state.segmentDuration.toFixed(1)}s / hop`;

    }

    function render() {
      buildPath();
      renderMarkers();
      renderMeta();
      if (state.stops.length && !state.isPlaying) {
        placeSquare(state.stops[0]);
      }
      if (!state.stops.length) {
        square.style.opacity = '.35';
      }
    }

    function addStop(point) {
      snapshotHistory();
      state.stops.push({ id: makeId(), x: point.x, y: point.y });
      if (state.stops.length === 1) placeSquare(point);
      render();
    }

    function removeStop(id) {
      snapshotHistory();
      state.stops = state.stops.filter(stop => stop.id !== id);
      if (state.currentSegment >= state.stops.length) state.currentSegment = 0;
      if (state.stops.length < 2) stopAnimation();
      render();
    }

    function beginDrag(event, id) {
      event.stopPropagation();
      stopAnimation();
      const marker = event.currentTarget;
      marker.classList.add('dragging');
      state.dragId = id;
      state.pointerMoved = false;
      marker.setPointerCapture(event.pointerId);
    }

    function onPointerMove(event) {
      if (!state.dragId) return;
      state.pointerMoved = true;
      const point = getStagePoint(event.clientX, event.clientY);
      const stop = state.stops.find(item => item.id === state.dragId);
      if (!stop) return;
      stop.x = point.x;
      stop.y = point.y;
      render();
    }

    function onPointerUp(event) {
      const dragging = markerLayer.querySelector('.marker.dragging');
      if (dragging) dragging.classList.remove('dragging');
      state.dragId = null;
    }

    function handleStagePointerDown(event) {
      if (state.isPlaying) return;
      const clickedMarker = event.target.closest('.marker');
      if (clickedMarker) return;
      const point = getStagePoint(event.clientX, event.clientY);
      addStop(point);
    }

    function animate(timestamp) {
      if (!state.isPlaying || state.stops.length < 2) return;
      if (!state.animationStart) state.animationStart = timestamp;

      const from = state.stops[state.currentSegment % state.stops.length];
      const to = state.stops[(state.currentSegment + 1) % state.stops.length];
      const elapsed = (timestamp - state.animationStart) / 1000;
      const t = clamp(elapsed / state.segmentDuration, 0, 1);
      const ease = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      const x = from.x + (to.x - from.x) * ease;
      const y = from.y + (to.y - from.y) * ease;
      placeSquare({ x, y });

      if (t >= 1) {
        state.currentSegment = (state.currentSegment + 1) % state.stops.length;
        state.animationStart = timestamp;
        renderMarkers();
      }
      state.rafId = requestAnimationFrame(animate);
    }

    function startAnimation() {
      if (state.stops.length < 2) {
        return;
      }
      state.isPlaying = true;
      state.animationStart = 0;
      state.currentSegment = 0;
      render();
      cancelAnimationFrame(state.rafId);
      state.rafId = requestAnimationFrame(animate);
    }

    function stopAnimation() {
      state.isPlaying = false;
      state.animationStart = 0;
      cancelAnimationFrame(state.rafId);
      state.rafId = null;
      renderMeta();
      renderMarkers();
      if (state.stops.length) placeSquare(state.stops[0]);
    }

    function clearAll() {
      if (!state.stops.length) return;
      snapshotHistory();
      stopAnimation();
      state.stops = [];
      state.currentSegment = 0;
      render();
    }

    function seedLine() {
      snapshotHistory();
      stopAnimation();
      const w = stage.clientWidth;
      const h = stage.clientHeight;
      state.stops = [
        { id: makeId(), x: w * 0.18, y: h * 0.5 },
        { id: makeId(), x: w * 0.38, y: h * 0.5 },
        { id: makeId(), x: w * 0.58, y: h * 0.5 },
        { id: makeId(), x: w * 0.78, y: h * 0.5 }
      ];
      render();
    }

    function seedRandom() {
      snapshotHistory();
      stopAnimation();
      const w = stage.clientWidth;
      const h = stage.clientHeight;
      const count = 5 + Math.floor(Math.random() * 3);
      const minDistance = 52;
      const stops = [];

      for (let i = 0; i < count; i++) {
        let placed = false;
        for (let attempt = 0; attempt < 250; attempt++) {
          const candidate = {
            id: makeId(),
            x: Math.round(w * (0.14 + Math.random() * 0.72)),
            y: Math.round(h * (0.18 + Math.random() * 0.64))
          };
          const overlaps = stops.some(stop => Math.hypot(stop.x - candidate.x, stop.y - candidate.y) < minDistance);
          if (!overlaps) {
            stops.push(candidate);
            placed = true;
            break;
          }
        }
        if (!placed) {
          stops.push({
            id: makeId(),
            x: Math.round(w * (0.14 + Math.random() * 0.72)),
            y: Math.round(h * (0.18 + Math.random() * 0.64))
          });
        }
      }

      state.stops = stops;
      render();
    }

    stage.addEventListener('pointerdown', handleStagePointerDown);

    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
    window.addEventListener('pointercancel', onPointerUp);

    document.getElementById('playBtn').addEventListener('click', startAnimation);
    document.getElementById('pauseBtn').addEventListener('click', stopAnimation);
    document.getElementById('previewBtn').addEventListener('click', () => {
      stopAnimation();
      if (state.stops.length) {
        placeSquare(state.stops[0]);
      }
    });
    document.getElementById('undoBtn').addEventListener('click', restoreHistory);
    document.getElementById('clearBtn').addEventListener('click', clearAll);
    document.getElementById('shuffleBtn').addEventListener('click', seedRandom);
    document.getElementById('lineBtn').addEventListener('click', seedLine);

    speedSlider.addEventListener('input', () => {
      state.segmentDuration = 5 - (Number(speedSlider.value) - 1) * 0.4875;
      speedValue.textContent = `${state.segmentDuration.toFixed(1)}s / hop`;
    });

    window.addEventListener('resize', () => {
      if (!state.stops.length) {
        render();
        return;
      }
      const oldWidth = stage.clientWidth || 1;
      const oldHeight = stage.clientHeight || 1;
      requestAnimationFrame(() => {
        const newWidth = stage.clientWidth || 1;
        const newHeight = stage.clientHeight || 1;
        state.stops = state.stops.map(stop => ({
          ...stop,
          x: (stop.x / oldWidth) * newWidth,
          y: (stop.y / oldHeight) * newHeight
        }));
        render();
      });
    });

    seedRandom();
  </script>
</body>
</html>
